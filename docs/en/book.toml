[book]
title = "discord_forum_todo Documentation"
description = "User, admin, operator, and developer manuals for the Discord Forum Todo Bot"
authors = ["varubogu"]
language = "en"
multilingual = false
src = "."

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/varubogu/discord_forum_todo"
edit-url-template = "https://github.com/varubogu/discord_forum_todo/edit/main/docs/en/{path}"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
