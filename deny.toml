[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # sea-orm-macros -> sea-bae -> proc-macro-error2. The crate is unmaintained
    # and RustSec says no patched release exists. sea-orm 1.1.20 (latest 1.x)
    # and sea-orm 2.0.4 still enable `sea-bae` via the `derive`/`macros` feature
    # this workspace needs, so there is no upgrade that drops the dependency.
    # It is a proc-macro (compile time only) and is not linked into the bot binary.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained; pulled in only at compile time via sea-orm-macros/sea-bae, and neither sea-orm 1.1 nor 2.0 has dropped it" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Mozilla CCADB root certificates shipped by webpki-roots / webpki-root-certs.
# CDLA-Permissive-2.0 is a permissive data license (use, modification, and
# redistribution with notice). Scoped to those crates so other packages cannot
# enter the graph under the same license.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]
confidence-threshold = 0.85

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
