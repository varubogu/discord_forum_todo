# Weekly Dependabot version updates.
# Schema: https://json.schemastore.org/dependabot-2.0.json
# Options: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # Cargo workspace. The root Cargo.toml / Cargo.lock covers every member
  # (crates/* and migration). Member crates have no lockfile of their own.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors that share a release line. A single crate bump (for example
      # twilight-model without twilight-http) duplicates types and does not compile.
      twilight:
        patterns:
          - "twilight-*"
        update-types:
          - "major"
      testcontainers:
        patterns:
          - "testcontainers"
          - "testcontainers-modules"
        update-types:
          - "major"
      fluent:
        patterns:
          - "fluent"
          - "fluent-*"
        update-types:
          - "major"
      sea-orm:
        patterns:
          - "sea-orm"
          - "sea-orm-migration"
        update-types:
          - "major"

  # rust-toolchain.toml at the repository root.
  # The channel is currently the floating name "stable". Dependabot only
  # proposes updates for versioned channels (1.x / 1.x.y) and dated
  # beta/nightly channels, so this entry stays idle until the channel is pinned.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # docker/Dockerfile (FROM images and the dockerfile syntax directive).
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # docker/docker-compose.yml and docker/docker-compose.dev.yml.
  # Compose is a separate ecosystem from Dockerfiles.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions in .github/workflows (directory "/" is the documented root).
  # One group covers every update type, including major, so action bumps land
  # in a single PR instead of one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
